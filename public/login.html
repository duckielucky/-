<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2b1348" />
<title>登录 · 幸运刮刮乐</title>
<link rel="icon" href="/favicon.svg" />
<link rel="stylesheet" href="/lucky-account.css" />
</head>
<body>
<div class="auth-shell">
  <div class="orb a"></div><div class="orb b"></div>

  <main class="auth-card">
    <div class="brand"><div class="mark">✦</div><b>LUCKY<i>·</i>SCRATCH</b></div>
    <div class="auth-head">
      <h1>登录</h1>
    </div>

    <div class="form-error" id="formError" role="alert"></div>

    <form id="loginForm" novalidate autocomplete="on">
      <div class="field" id="f-identity">
        <label for="identity">用户名或邮箱</label>
        <div class="control"><input id="identity" name="identity" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="luckystar" /></div>
        <div class="hint" id="h-identity"></div>
      </div>

      <div class="field" id="f-password">
        <label for="password">密码</label>
        <div class="control has-btn">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
          <button type="button" class="reveal" data-target="password" aria-label="显示密码">显示</button>
        </div>
        <div class="hint" id="h-password"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">登录</button>

      <div class="rowlink">
        <button type="button" class="linkbtn" id="forgot">忘记密码？</button>
        <a href="/register.html" class="linkbtn" style="color:var(--gold);text-decoration:none">注册玩家账户 →</a>
      </div>
    </form>

    <p class="auth-alt" style="margin-top:12px"><button type="button" class="linkbtn" id="testLogin" style="color:var(--gold);font-weight:700">一键登录试玩账号（test / 1111）</button></p>

    <p class="auth-note"><span>云端账户 · 游戏进度可跨设备同步</span></p>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/lucky-account.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var toast = $("toast"), toastTimer;
  function showToast(msg, kind) {
    toast.textContent = msg;
    toast.className = "toast on" + (kind ? " " + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.className = "toast"; }, 2600);
  }

  // Confirm the signed HttpOnly cloud session before skipping the login form.
  LuckyAuth.refreshSession().then(function (session) {
    if (session.ok) location.replace(LuckyAuth.safeNext("/"));
  });

  document.querySelectorAll(".reveal").forEach(function (btn) {
    btn.onclick = function () {
      var inp = $(btn.dataset.target);
      var show = inp.type === "password";
      inp.type = show ? "text" : "password";
      btn.textContent = show ? "隐藏" : "显示";
      btn.setAttribute("aria-label", (show ? "隐藏" : "显示") + "密码");
    };
  });

  $("testLogin").onclick = function () {
    $("identity").value = LuckyAuth.TEST_USER;
    $("password").value = LuckyAuth.TEST_PASS;
    var f = $("loginForm");
    if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
  };

  $("forgot").onclick = function () {
    showToast("暂未开放自动找回，请联系管理员", "err");
    $("h-password").textContent = "账户已保存在云端；如忘记密码，请联系管理员协助处理。";
    $("h-password").classList.add("err");
  };

  var form = $("loginForm"), submitBtn = $("submitBtn"), formError = $("formError");
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    formError.className = "form-error";
    $("f-identity").classList.remove("bad");
    $("f-password").classList.remove("bad");
    $("h-password").classList.remove("err");
    $("h-password").textContent = "";

    var identity = $("identity").value.trim();
    var password = $("password").value;
    if (!identity) { $("f-identity").classList.add("bad"); showToast("请输入用户名或邮箱", "err"); return; }
    if (!password) { $("f-password").classList.add("bad"); showToast("请输入密码", "err"); return; }

    submitBtn.disabled = true; submitBtn.textContent = "登录中…";
    try {
      var res = await LuckyAuth.login({ identity: identity, password: password });
      if (!res.ok) {
        formError.textContent = res.error; formError.className = "form-error on";
        $("f-identity").classList.add("bad"); $("f-password").classList.add("bad");
        submitBtn.disabled = false; submitBtn.textContent = "登录";
        return;
      }
      showToast("欢迎回来，" + res.account.displayName + "！", "ok");
      setTimeout(function () { location.href = LuckyAuth.safeNext("/"); }, 550);
    } catch (err) {
      formError.textContent = "登录失败，请重试。";
      formError.className = "form-error on";
      submitBtn.disabled = false; submitBtn.textContent = "登录";
    }
  });
})();
</script>
</body>
</html>
