<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>登录运营后台 · 幸运刮刮乐</title>
<link rel="icon" href="/favicon.svg" />
<style>
  :root{
    color-scheme:dark;
    --bg:#09040f;--panel:#16091f;--panel-2:#100716;
    --ink:#fbf8ff;--muted:#b4a7c4;--dim:#897d98;
    --line:#ffffff18;--line-strong:#ffffff2b;
    --signal:#a83cff;--signal-2:#7c2eff;--cyan:#2ce9d3;--gold:#ffd76e;
    --danger:#ff746d;--ok:#37c07a;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;
    font-family:var(--font);color:var(--ink);background:
      radial-gradient(circle at 50% -10%,#a83cff45 0,transparent 42%),
      radial-gradient(circle at -8% 70%,#7c2eff24 0,transparent 35%),
      linear-gradient(180deg,#0c0513 0%,var(--bg) 52%,#050208 100%);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(#ffffff50 .65px,transparent .65px);
    background-size:9px 9px;opacity:.2;
    -webkit-mask-image:linear-gradient(to bottom,#000,transparent 82%);
    mask-image:linear-gradient(to bottom,#000,transparent 82%);
  }
  button,input{font:inherit}
  button,a{-webkit-tap-highlight-color:transparent}
  button{cursor:pointer}
  .topbar{
    position:relative;z-index:2;display:flex;align-items:center;gap:12px;
    padding:calc(16px + env(safe-area-inset-top)) clamp(18px,4vw,34px) 16px;
    border-bottom:1px solid var(--line);background:#0f0616b8;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{
    width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:10px;
    border:1px solid #c26bff66;background:linear-gradient(145deg,var(--signal),#6120c6);
    color:#fff;font-weight:800;box-shadow:0 0 22px #a83cff4d;
  }
  .brand strong{display:block;font-size:14px;font-weight:650;letter-spacing:-.01em}
  .brand span{display:block;margin-top:1px;color:var(--dim);font-size:11px}
  .topbar-spacer{flex:1}
  main{
    position:relative;z-index:1;display:grid;place-items:center;width:100%;
    padding:34px 20px 54px;
  }
  .login-card{
    width:min(100%,430px);padding:34px;border:1px solid var(--line);border-radius:22px;
    background:linear-gradient(155deg,#281238ed,var(--panel) 48%,#0d0713f5);
    box-shadow:0 28px 80px #000b,inset 0 1px #ffffff14,0 0 44px #a83cff18;
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  }
  .lock-mark{
    width:52px;height:52px;display:grid;place-items:center;margin-bottom:22px;border-radius:15px;
    border:1px solid #c26bff70;background:linear-gradient(145deg,var(--signal),var(--signal-2));color:#fff;
    box-shadow:0 0 28px #a83cff59,inset 0 1px #ffffff55;
    font-size:22px;font-weight:700;
  }
  h1{margin:0;font-size:29px;line-height:1.15;letter-spacing:-.035em;font-weight:700}
  .intro{margin:11px 0 26px;color:var(--muted);font-size:14px;line-height:1.65}
  .session-note{
    display:flex;align-items:center;gap:7px;width:max-content;max-width:100%;
    margin-bottom:20px;padding:5px 10px;border:1px solid #2ce9d34d;
    border-radius:999px;background:#2ce9d312;color:#7cfbed;font-size:11px;font-weight:700;
  }
  .session-note i{width:6px;height:6px;flex:none;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px #2ce9d3}
  .field{display:grid;gap:8px}
  label{font-size:12px;font-weight:600;color:var(--muted)}
  .password-wrap{position:relative}
  .field + .field{margin-top:16px}
  input{
    width:100%;height:48px;padding:0 14px;border:1px solid var(--line-strong);border-radius:11px;
    outline:none;background:var(--panel-2);color:var(--ink);font-size:16px;
    transition:border-color .16s ease,box-shadow .16s ease,opacity .16s ease;
  }
  input::placeholder{color:#71647f}
  .password-wrap input{padding-right:76px}
  input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #2ce9d326,0 0 20px #2ce9d312}
  input:disabled{opacity:.62}
  .reveal{
    position:absolute;right:6px;top:6px;height:36px;padding:0 10px;border:0;border-radius:7px;
    background:transparent;color:var(--cyan);font-size:12px;font-weight:700;
  }
  .reveal:hover{background:color-mix(in srgb,var(--signal) 9%,transparent)}
  .reveal:disabled{opacity:.45;cursor:default}
  .form-error{
    display:none;margin:11px 0 0;padding:10px 12px;border-radius:9px;
    border:1px solid color-mix(in srgb,var(--danger) 32%,var(--line));
    background:color-mix(in srgb,var(--danger) 8%,transparent);color:var(--danger);
    font-size:12px;line-height:1.5;
  }
  .form-error.on{display:block}
  .submit{
    width:100%;height:48px;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;
    border:1px solid #8bfff3;border-radius:11px;background:linear-gradient(180deg,#4effe8,#20c8b9);color:#061b17;
    box-shadow:0 0 24px #24e6d03d,inset 0 1px #ffffff80;
    font-size:14px;font-weight:850;transition:filter .16s ease,transform .1s ease,opacity .16s ease;
  }
  .submit:hover{filter:brightness(1.08)}
  .submit:active{transform:translateY(1px)}
  .submit:disabled{opacity:.58;cursor:default;transform:none}
  .spinner{
    display:none;width:15px;height:15px;border:2px solid rgba(255,255,255,.42);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  }
  .submit.loading .spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .checking{
    min-height:18px;margin:14px 0 0;text-align:center;color:var(--dim);font-size:11px;
  }
  .checking[data-state="idle"]{visibility:hidden}
  .divider{height:1px;margin:24px 0 18px;background:var(--line)}
  .back-link{
    display:flex;align-items:center;justify-content:center;gap:7px;color:var(--cyan);
    text-decoration:none;font-size:13px;font-weight:550;
  }
  .back-link:hover{text-decoration:underline}
  footer{position:relative;z-index:1;padding:0 20px calc(22px + env(safe-area-inset-bottom));text-align:center;color:var(--dim);font-size:11px}
  @media (max-width:520px){
    .topbar{padding-left:16px;padding-right:16px}
    main{place-items:start center;padding:24px 14px 42px}
    .login-card{padding:27px 22px;border-radius:17px}
    h1{font-size:26px}
  }
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.spinner{animation-duration:1.4s}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div><strong>幸运刮刮乐</strong><span>运营后台</span></div>
    </div>
    <div class="topbar-spacer"></div>
  </header>

  <main>
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="lock-mark" aria-hidden="true">⌁</div>
      <div class="session-note"><i></i><span>安全的浏览器会话</span></div>
      <h1 id="loginTitle">登录运营后台</h1>
      <p class="intro">使用管理员用户名与管理密码登录。本次浏览器会话将保持登录，无需在每次保存时重复输入。</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" placeholder="管理员用户名" autocomplete="username" autocapitalize="none" spellcheck="false" required disabled />
        </div>
        <div class="field">
          <label for="password">管理密码</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required disabled />
            <button class="reveal" id="revealPassword" type="button" aria-label="显示密码" aria-pressed="false" disabled>显示</button>
          </div>
        </div>
        <div class="form-error" id="loginError" role="alert" aria-live="polite"></div>
        <button class="submit" id="submitButton" type="submit" disabled>
          <span class="spinner" aria-hidden="true"></span>
          <span id="submitLabel">登录</span>
        </button>
      </form>

      <p class="checking" id="checkingStatus" data-state="checking" role="status" aria-live="polite">正在检查已有登录会话…</p>
      <div class="divider"></div>
      <a class="back-link" href="/"><span aria-hidden="true">←</span><span>返回游戏</span></a>
    </section>
  </main>

  <footer>后台会话不会更改或同步玩家账号与游戏进度。</footer>

<script>
(function () {
  "use strict";

  // Remove the retired client-readable master key from tabs that used the old manager.
  try { sessionStorage.removeItem("lucky_manager_token_v1"); } catch (e) {}

  var SESSION_API = "/api/manager/session";
  var form = document.getElementById("loginForm");
  var username = document.getElementById("username");
  var password = document.getElementById("password");
  var reveal = document.getElementById("revealPassword");
  var submit = document.getElementById("submitButton");
  var submitLabel = document.getElementById("submitLabel");
  var error = document.getElementById("loginError");
  var checking = document.getElementById("checkingStatus");
  var busy = false;

  function safeDestination() {
    try {
      var requested = new URL(window.location.href).searchParams.get("next");
      if (requested === "/manager.html") return requested;
    } catch (e) {}
    return "/manager.html";
  }

  function goToManager() {
    window.location.replace(safeDestination());
  }

  function setEnabled(enabled) {
    username.disabled = !enabled;
    password.disabled = !enabled;
    reveal.disabled = !enabled;
    submit.disabled = !enabled;
    checking.setAttribute("data-state", enabled ? "idle" : "checking");
    if (enabled) window.setTimeout(function () { (username.value.trim() ? password : username).focus(); }, 0);
  }

  function showError(message) {
    error.textContent = message;
    error.className = "form-error on";
  }

  function clearError() {
    error.textContent = "";
    error.className = "form-error";
  }

  function setLoading(loading) {
    busy = loading;
    username.disabled = loading;
    password.disabled = loading;
    reveal.disabled = loading;
    submit.disabled = loading;
    submit.classList.toggle("loading", loading);
    submitLabel.textContent = loading ? "正在登录…" : "登录";
  }

  reveal.addEventListener("click", function () {
    var showing = password.type === "text";
    password.type = showing ? "password" : "text";
    reveal.textContent = showing ? "显示" : "隐藏";
    reveal.setAttribute("aria-label", showing ? "显示密码" : "隐藏密码");
    reveal.setAttribute("aria-pressed", showing ? "false" : "true");
    password.focus();
  });

  password.addEventListener("input", clearError);
  username.addEventListener("input", clearError);

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    if (busy) return;
    clearError();
    if (!username.value.trim()) {
      showError("请输入用户名。");
      username.focus();
      return;
    }
    if (!password.value) {
      showError("请输入管理密码。");
      password.focus();
      return;
    }

    setLoading(true);
    try {
      var response = await fetch(SESSION_API, {
        method: "POST",
        credentials: "same-origin",
        cache: "no-store",
        headers: { "accept": "application/json", "content-type": "application/json" },
        body: JSON.stringify({ username: username.value.trim(), password: password.value })
      });
      if (response.ok) {
        password.value = "";
        goToManager();
        return;
      }
      password.select();
      showError(response.status === 401
        ? "无法登录，请检查用户名或管理密码后重试。"
        : "暂时无法登录，请稍后重试。");
    } catch (e) {
      showError("无法连接登录服务，请检查网络后重试。");
    } finally {
      setLoading(false);
    }
  });

  async function checkExistingSession() {
    setEnabled(false);
    try {
      var response = await fetch(SESSION_API, {
        method: "GET",
        credentials: "same-origin",
        cache: "no-store",
        headers: { "accept": "application/json" }
      });
      if (response.ok) { goToManager(); return; }
      if (response.status !== 401) showError("暂时无法检查登录状态，仍可尝试登录。");
    } catch (e) {
      showError("无法检查登录状态，仍可尝试登录。");
    }
    setEnabled(true);
  }

  void checkExistingSession();
})();
</script>
</body>
</html>
